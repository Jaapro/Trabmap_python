# Trabmap configuration file
# Edit the paths to whatever works on your device
# parameters are set to defaults that appear to work well across a range
# of situations. They can be tweaked manually if required.

segmentation:
  runner_csv: data/trabmap_runner.csv
  input_root: input

  object_column: object
  segmented_column: segmented
  voxel_size_column: voxel_size
  # If a matching *_TRABCORT folder exists,Trabmap skips RAW thresholding 
  # and uses that stack directly
  input_folder_suffix: _TRABCORT

  # -----------------------------------------------------------------------
  # Optional RAW-to-TRABCORT binarization
  # -----------------------------------------------------------------------
  # When auto_segment_raw is true and no *_TRABCORT folder exists, Trabmap
  # looks for a folder ending in *_RAW, thresholds it with the chosen method,
  # and saves the resulting binary bone stack as OBJECT_TRABCORT before 
  # continuing with the cortical/trabecular compartment segmentation.
  raw_folder_suffix: _RAW
  auto_segment_raw: true

  # Available methods: otsu, multiotsu, manual.
  raw_segmentation_method: otsu

  # Used only when raw_segmentation_method: manual.
  raw_manual_threshold: null

  # Used only when raw_segmentation_method: multiotsu.
  # With 3 classes and raw_bone_class_min: 2, only the highest-intensity class
  # is retained as bone. Otsu is recommended over multiotsu
  raw_multiotsu_classes: 3
  raw_bone_class_min: 2

  # Optional cleanup of the thresholded RAW mask before writing TRABCORT.
  raw_use_median_filter: true
  raw_median_size_voxels: [1, 3, 3]
  raw_keep_largest_component: true
  raw_min_object_size: 1000

  # Save threshold/check images to the object's DEBUG folder.
  raw_save_threshold_debug: true

  periosteal_threshold: 1
  endosteal_threshold: 1
  image_extensions: [.tif, .tiff, .png, .jpg, .jpeg]

  min_bone_object_size: 1000
  use_median_filter: false
  median_size_voxels: [1, 3, 3]

  crop_to_bone_bbox: true
  bbox_padding_voxels: 10

  cap_for_3d_fill: true
  cap_thickness_slices: 5
  surface_hole_close_radius_mm: 0.60 # default 0.60

  keep_largest_internal_void_component: true
  protected_bone_close_radius_mm: 0.05 # radius used to close the cortex, not trabecular cavity. default is 0.05
  marrow_close_radius_mm: 0.70 # radius of structuring element to close marrow cavity, default = 0.70
  internal_fill_mode: 3d
  keep_largest_trabfill_component: true
  remove_thin_trab_edge_lines: true
  thin_trab_open_radius_voxels: 2
  save_middle_slice_debugs: true

mapping:
  runner_csv: data/trabmap_runner.csv
  input_root: input

  landmarks_csv: null
  use_custom_anatomical_frame: false

  sphere_radius: 2.5
  grid_step: 2.5
  margin: null

  # can be skip_outside or zero_outside. Skip outside is recommended
  center_inclusion_mode: skip_outside 

  # Boundary handling for non-BV/TV measurements.
  # BV/TV already ignores voxels outside TRABFILL in its denominator.
  # These settings apply this approach to operations involving EDT, such 
  # as thickness, spacing, and DAst. Boundary diagnostics
  # are saved so effects of boundary conditions can be evaluated by the user
  clip_non_bvtv_to_filled_mask: true
  ignore_trabfill_boundary_for_thickness: true
  save_boundary_diagnostics: true
  save_mapping_debug_images: false

  # Trabecular spacing, calculated as 2 * EDT(marrow space inside TRABFILL).
  # The boundary mode treats voxels outside TRABFILL as outside the
  # analysis compartment rather than as true marrow/background.
  calculate_trabecular_spacing: true
  ignore_trabfill_boundary_for_spacing: true



  # Gaussian sigma in millimetres.
  # The structure tensor is calculated after Gaussian smoothing of the EDT
  # map. Specifying sigma in physical units ensures that
  # anisotropy is measured over the same anatomical scale regardless of
  # scan resolution.
  #
  # Recommended values:
  #
  # 0.05 mm  -> perhaps good for high resolution data
  # 0.10 mm  -> default
  # 0.20 mm  -> stronger smoothing for noisy or low res data
  ### note: I might make it scale with mean trabecular thickness in later implementations
  # not sure yet if that is a good idea
  use_structure_tensor: true
  st_sigma: 0.1

  # Optional Mean Intercept Length (MIL) anisotropy.
  # This is much slower than the structure-tensor method but is the default for the field
  # If true, Trabmap adds anisotropy_mil, primary_dir_mil_z/y/x,
  # primary_dir_mil_anat_1/2/3, and related diagnostic columns.
  use_mil_anisotropy: false

  # MIL mode. Use "medtool" to approximate Medtool defaults as closely as possible.
  # however, this is not equivalent to medtool and I should remove this stupid name
  # Medtool defaults: -fabm MIL, -faba ellipsoid, -fabn det,
  # -morp step=5;power=2;validLength=0.
  mil_method: medtool        # "standard" or "medtool"
  mil_power: 2              # defaukt power is 2. sMedtool power; directions = 8 * 4^power = 128
  mil_n_directions: 128     # used only when mil_power is null
  mil_length_units: voxels  # Medtool step/validLength are in voxels
  mil_line_spacing: 5       # Medtool -morp step default
  mil_sample_step: 5        # ray sampling step; use 5 for closest Medtool-like behavior
  mil_valid_length: 0       # Medtool -morp validLength default
  mil_min_intersections: 0  # legacy TrabMap setting; ignored by mil_method: medtool
  mil_fabric_shape: ellipsoid
  mil_norm_type: det
  mil_da_mode: bounded        # use bounded for 0-1 scaling, ratio for DA from 1-inf

  # old code, leave this set to false unless you have good reason to crop your dataset
  use_crop: false
  crop_z: [0, 300]
  crop_y: [0, 300]
  crop_x: [0, 350]

  save_auto_filled_mask: true
  save_point_vtp: true
  save_dense_nifti: false
  dense_map_mode: local_sphere
  progress_every: 50

  # Optional smoothed/decimated surface mesh export for downstream stuff like
  # Phenotypic Point Cloud Analysis (see DeMars et al. 2021)
  # Meshes are generated from the segmentation stacks listed in
  # surface_mesh_suffixes, usually _FILL and _TRABFILL, and written to
  # input/OBJECT_NAME/mappings/surface_meshes/
  make_surface_meshes: true
  surface_mesh_suffixes: [_FILL, _TRABFILL]
  surface_mesh_output_dir_name: surface_meshes
  # VTP is kept for ParaView/PyVista workflows; STL is also written when
  # surface_mesh_save_stl is true.
  surface_mesh_file_format: vtp
  surface_mesh_save_stl: true
  surface_mesh_pad_width: 1
  surface_mesh_keep_largest_component: true
  surface_mesh_smooth_iterations: 30
  surface_mesh_smooth_relaxation: 0.05
  surface_mesh_decimate: true
  surface_mesh_target_reduction: 0.90
  surface_mesh_max_file_size_mb: 5.0
  surface_mesh_fail_on_error: true

  make_mesh: true

  # Tetrahedral mesh backend:
  # tetgen = surface-first PyVista/TetGen workflow (old, not recommended)
  # cgal = default CGAL workflow via pygalmesh (default option, highly recommended, may be issues on Macs)
  mesh_backend: cgal

  # CGAL mesh settings used when mesh_backend: cgal.
  # cgal_length_units can be voxels or mm
  cgal_length_units: mm
  cgal_max_element_size: 1.0   # internal tetrahedron size / max cell circumradius
  cgal_facet_distance: 0.3     # surface approximation tolerance
  cgal_verbose: false

  mesh_out: null
  mesh_target: cells
  mesh_method: idw
  mesh_k: 4
  mesh_power: 2.0
  mesh_value_columns: null

  mesh_pad_width: 20
  mesh_largest_component: true
  meshfix: true
  pyacvd: true
  pyacvd_n_surf: 10000 #reduce if it causes failure to mesh
  pyacvd_subdivide: 0
  tetgen_switches: pq1.2Q


# -------------------------------------------------------------------------
# Low-memory mapping settings
# -------------------------------------------------------------------------

# Use disk to store temporary arrays and chunked structure-tensor calculations.
# Recommended for computers with limited RAM.
# this will slow down operations alot so set to false if your workstation has 
# sufficient RAM
low_memory_mode: false

# Temporary working directory.
# null = use a temporary folder inside the object's mapping output directory.
# Alternatively specify a different location on a fast SSD drive if available
# the faster the drive, the faster the computations
low_memory_temp_root: null

# Number of z-slices processed simultaneously during structure-tensor analysis.
# 32 is a reasonable starting point.
# smaller chunks use less memory but take longer to run.
# Reduce to 16 or 8 if RAM requirement is still exceeded.
low_memory_st_chunk_slices: 32

# Overlap between ST chunks, expressed as multiples of Gaussian sigma.
# Leave at 6.0 to avoid boundary effects!
low_memory_st_halo_sigma: 6.0

# Number of slices handled at once for binary-mask operations.
low_memory_mask_chunk_slices: 32

# Delete disk-backed temporary files after an object completes successfully.
# TO DO: trabmap currently leaves temoporary files if the run fails, need to fix this
low_memory_cleanup_temp: true