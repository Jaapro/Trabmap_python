# TrabMap configuration file
# Edit mhese paths and variabeles, then run command line scripts

segmentation:
  runner_csv: data/trabmap_runner.csv
  input_root: input

  object_column: object
  segmented_column: segmented
  voxel_size_column: voxel_size
  input_folder_suffix: _TRABCORT

  periosteal_threshold: 1
  endosteal_threshold: 1
  image_extensions: [.tif, .tiff, .png, .jpg, .jpeg]

  min_bone_object_size: 1000
  use_median_filter: true
  median_size_voxels: [1, 3, 3]

  crop_to_bone_bbox: true
  bbox_padding_voxels: 10

  cap_for_3d_fill: true
  cap_thickness_slices: 5
  surface_hole_close_radius_mm: 0.60 # default 0.60

  keep_largest_internal_void_component: true
  protected_bone_close_radius_mm: 0.08 #default is 0.05
  marrow_close_radius_mm: 0.70 
  internal_fill_mode: 3d
  keep_largest_trabfill_component: true
  remove_thin_trab_edge_lines: true
  thin_trab_open_radius_voxels: 2
  save_middle_slice_debugs: true

mapping:
  runner_csv: data/trabmap_runner.csv
  input_root: input

  landmarks_csv: null
  use_custom_anatomical_frame: false

  sphere_radius: 2.5
  grid_step: 2.5
  margin: null
  center_inclusion_mode: skip_outside

  # Boundary handling for non-BV/TV measurements.
  # BV/TV already ignores voxels outside TRABFILL in its denominator.
  # These settings apply the same logic to trabecular thickness and to the
  # local samples used for structure-tensor anisotropy. Boundary diagnostics
  # are saved so boundary VOIs can be evaluated rather than excluded.
  clip_non_bvtv_to_filled_mask: true
  ignore_trabfill_boundary_for_thickness: true
  save_boundary_diagnostics: true
  save_mapping_debug_images: false

  # Trabecular spacing, calculated as 2 * EDT(marrow space inside TRABFILL).
  # The boundary-aware mode treats voxels outside TRABFILL as outside the
  # analysis compartment rather than as true marrow/background.
  calculate_trabecular_spacing: true
  ignore_trabfill_boundary_for_spacing: true

  use_structure_tensor: true
  st_sigma: 1.0

  # Optional Mean Intercept Length (MIL) anisotropy.
  # This is much slower than the structure-tensor method, so the default is false.
  # If true, TrabMap adds anisotropy_mil, primary_dir_mil_z/y/x,
  # primary_dir_mil_anat_1/2/3, and related diagnostic columns.
  use_mil_anisotropy: true

  # MIL mode. Use "medtool" to approximate Medtool defaults as closely as possible.
  # Medtool defaults: -fabm MIL, -faba ellipsoid, -fabn det,
  # -morp step=5;power=2;validLength=0.
  mil_method: medtool        # "standard" or "medtool"
  mil_power: 2              # Medtool power; directions = 8 * 4^power = 128
  mil_n_directions: 128     # used only when mil_power is null
  mil_length_units: voxels  # Medtool step/validLength are in voxels
  mil_line_spacing: 5       # Medtool -morp step default
  mil_sample_step: 5        # ray sampling step; use 5 for closest Medtool-like behavior
  mil_valid_length: 0       # Medtool -morp validLength default
  mil_min_intersections: 0  # legacy TrabMap setting; ignored by mil_method: medtool
  mil_fabric_shape: ellipsoid
  mil_norm_type: det
  mil_da_mode: bounded        # use bounded for 0-1 visualization, ratio for Medtool-like DA from 1-inf;

  use_crop: false
  crop_z: [0, 300]
  crop_y: [0, 300]
  crop_x: [0, 350]

  save_auto_filled_mask: true
  save_point_vtp: true
  save_dense_nifti: false
  dense_map_mode: local_sphere
  progress_every: 50

  # Optional smoothed/decimated surface mesh export for downstream analyses.
  # Meshes are generated from the segmentation stacks listed in
  # surface_mesh_suffixes, usually _FILL and _TRABFILL, and written to
  # input/OBJECT_NAME/mappings/surface_meshes/.
  make_surface_meshes: true
  surface_mesh_suffixes: [_FILL, _TRABFILL]
  surface_mesh_output_dir_name: surface_meshes
  # VTP is kept for ParaView/PyVista workflows; STL is also written when
  # surface_mesh_save_stl is true.
  surface_mesh_file_format: vtp
  surface_mesh_save_stl: true
  surface_mesh_pad_width: 1
  surface_mesh_keep_largest_component: true
  surface_mesh_smooth_iterations: 30
  surface_mesh_smooth_relaxation: 0.05
  surface_mesh_decimate: true
  surface_mesh_target_reduction: 0.90
  surface_mesh_max_file_size_mb: 5.0
  surface_mesh_fail_on_error: true

  make_mesh: true

  # Tetrahedral mesh backend:
  # tetgen = surface-first PyVista/TetGen workflow
  # cgal = optional Medtool-like image-domain CGAL workflow via pygalmesh
  mesh_backend: cgal

  # CGAL / Medtool-like image-domain mesh settings. Used only when mesh_backend: cgal.
  # cgal_length_units can be voxels or mm. Voxels is closest to Medtool-style settings.
  cgal_length_units: mm
  cgal_max_element_size: 1.0   # internal tetrahedron size / max cell circumradius
  cgal_facet_distance: 0.3     # surface approximation tolerance
  cgal_verbose: false

  mesh_out: null
  mesh_target: cells
  mesh_method: idw
  mesh_k: 4
  mesh_power: 2.0
  mesh_value_columns: null

  mesh_pad_width: 20
  mesh_largest_component: true
  meshfix: true
  pyacvd: true
  pyacvd_n_surf: 10000 #reduce if it causes failure to mesh
  pyacvd_subdivide: 0
  tetgen_switches: pq1.2Q
