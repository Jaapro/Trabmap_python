[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trabmap"
version = "0.1.0"
description = "Open-source trabecular bone segmentation and whole-bone mapping pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jaap Saers"}]
license = {text = "MIT"}
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-image",
    "tifffile",
    "SimpleITK",
    "PyYAML",
]

[project.optional-dependencies]
mapping = ["nibabel", "pyvista", "tetgen", "pymeshfix", "pyacvd", "matplotlib"]

[project.scripts]
trabmap-segment = "trabmap.cli_segment:main"
trabmap-map = "trabmap.cli_map:main"

[tool.setuptools.packages.find]
where = ["src"]
